name: iOS Build

# mainブランチに変更が送信された時、または手動で動かす
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # 1. コードをMacに持ってくる
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Flutterを準備する
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. 秘密の金庫からAPIキーを取り出し、Mac上に一時的な .env ファイルを作る
      - name: Create .env file
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      # 4. パッケージを読み込む
      - name: Install dependencies
        run: flutter pub get

      # 5. iOS向けにビルド（証明書なし設定）
      - name: Build iOS
        run: flutter build ios --release --no-codesign

      # 6. 完成したアプリデータをダウンロード可能にする
      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-data
          path: build/ios/iphoneos/